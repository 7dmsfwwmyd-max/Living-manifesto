# One-time production trigger. Promotes only the exact approved validated artifact.
# Remove this file after the release succeeds or is rejected.
name: One-time Living Manifesto v0.5.7 production release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-lm-v057-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: living-manifesto-production
  cancel-in-progress: false
jobs:
  promote:
    if: "${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: one-shot approved Living Manifesto v0.5.7' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_RUN: '42503889422'
      RELEASE_SHA: '77aa3092e21ae1cda72cc4f9d9fd1712f006ca54'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact staging commit and successful validation gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$STAGING_RUN" = '42503889422'
          test "$RELEASE_SHA" = '77aa3092e21ae1cda72cc4f9d9fd1712f006ca54'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN" > /tmp/stage-run.json
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('/tmp/stage-run.json'));assert.equal(r.conclusion,'success');assert.equal(r.head_sha,process.env.RELEASE_SHA);assert.equal(r.path,'.github/workflows/staging-release.yml');"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.STAGING_RUN }}
          name: staging-validated-${{ env.RELEASE_SHA }}
          path: release
      - name: Promote exact immutable bytes and enforce production rollback checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZERO_COST_CONFIRMED: workers-free-no-payment-method
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/promote-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-${{ github.run_id }}
          path: |
            production-rollback.json
            production-validation.json
          retention-days: 30
