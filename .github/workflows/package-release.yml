name: Validate and package Living Manifesto
on:
  push:
    branches: [main, 'stabilise/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test the complete generated application
        run: node scripts/build.mjs
      - name: Package exact tested files
        run: cd dist && zip -qr ../living-manifesto-v0.5.7-cloudflare.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: living-manifesto-v0.5.7-${{ github.sha }}
          path: living-manifesto-v0.5.7-cloudflare.zip
          retention-days: 90
